name: pod-image
# Builds the GPU pod image (docker/pod.Dockerfile) when the locked environment changes; tagged by uv.lock hash.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [uv.lock, pyproject.toml, .python-version, docker/pod.Dockerfile]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - id: tag
        run: echo "lock=$(sha256sum uv.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pod.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hkjc-pod:lock-${{ steps.tag.outputs.lock }}
            ghcr.io/${{ github.repository_owner }}/hkjc-pod:latest
