[project]
name = "hkjc"
version = "1.11.0"
description = "Data, modelling and simulation bedrock for an automated HKJC betting research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "cachetools>=6.2.0",
    "numba>=0.62.1",
    "numpy>=2.3.3",
    "polars>=1.33.1",
    "pyarrow>=21.0.0",
    "requests>=2.32.5",
    "scipy>=1.16.2",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
deploy = [
    "modal>=1.4.3",
]
dev = [
    "pytest>=8",
    "ruff>=0.15.15",
    "matplotlib>=3.9",
]
# Probabilistic-programming / JAX stack for the Bayesian calibration (heavy; opt-in).
bayes = [
    "numpyro>=0.15",
    "jax>=0.4.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "N"]
ignore = ["E501"]   # long lines (mostly docstrings / GraphQL payloads) aren't worth churning

[tool.ruff.lint.per-file-ignores]
# Numerical / ML kernels use mathematical notation (X, N, P, W_obs, G, ...).
"src/hkjc/model/harville_model.py" = ["N803", "N806"]
"src/hkjc/model/conditional_logit.py" = ["N803", "N806"]
"tests/test_conditional_logit.py" = ["N806"]   # X = design matrix, mirrors the kernel
