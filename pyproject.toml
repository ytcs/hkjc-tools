[project]
name = "hkjc"
version = "2.0.0"
description = "HKJC race reconstruction: race data + the four replay videos -> per-horse 2D paths"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "cachetools>=6.2.0",
    "numba==0.62.1",
    "numpy>=2.3.3",
    "polars>=1.33.1",
    "pyarrow>=21.0.0",
    "requests>=2.32.5",
    "scipy>=1.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.15",
    "matplotlib>=3.9",
]
# Computer vision for the reconstruction (heavy; opt-in): video decode, OpenCV, the YOLO avatar
# detector, recognition-only OCR for the burnt-in clock / odometer / legend.
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "av>=12",
    "rapidocr-onnxruntime>=1.3",
    "openvino>=2026.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "N"]
ignore = ["E501"]   # long lines (mostly docstrings / GraphQL payloads) aren't worth churning

[tool.ruff.lint.per-file-ignores]
"src/hkjc/recon/*.py" = ["N803", "N806"]   # CV/estimation math notation (G=pose, H=homography, W=world pts, D2=difference op)
"tests/*.py" = ["N803", "N806", "N812"]     # tests mirror the kernels' notation
